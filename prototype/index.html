<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIBE AGY Qualification Lab</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #f4f7fb;
      color: #152238;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
    }
    main {
      width: min(42rem, calc(100% - 3rem));
      padding: 3rem;
      border: 1px solid #d8e1ee;
      border-radius: 1.25rem;
      background: #ffffff;
      box-shadow: 0 1.25rem 3rem rgba(33, 63, 102, 0.12);
    }
    .eyebrow {
      color: #356ad8;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0.75rem 0 1rem;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.05;
    }
    p {
      color: #4d5f78;
      font-size: 1.05rem;
      line-height: 1.7;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1rem;
      padding: 0.7rem 1rem;
      border-radius: 999px;
      background: #e9f8ef;
      color: #17653a;
      font-weight: 700;
    }
    .status::before {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      background: #28a762;
      content: "";
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Universal Runtime Qualification</div>
    <h1>VIBE AGY Qualification Lab</h1>
    <p>
      A dependency-free synthetic fixture for bounded verification of VIBE CODE
      runtime provisioning and compatible execution adapters.
    </p>
    <div class="status">Safe Runner Ready</div>
  </main>
</body>
</html>
